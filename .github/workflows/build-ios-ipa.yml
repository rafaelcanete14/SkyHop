name: Build Sky Hop iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build Unsigned IPA (iPhone 16 Pro Max / iOS 18+)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode with iOS SDK
        run: |
          if ! xcodebuild -showsdks 2>/dev/null | grep -q "iphoneos"; then
            for XC in $(ls -d /Applications/Xcode*.app 2>/dev/null | grep -v -i "beta" | sort -V -r); do
              if ls "$XC/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS"*.sdk >/dev/null 2>&1; then
                echo "Switching to $XC"
                sudo xcode-select -s "$XC/Contents/Developer"
                break
              fi
            done
          fi
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build SkyHop (Release - iphoneos arm64)
        run: |
          set +e
          xcodebuild clean build \
            -project SkyHop.xcodeproj \
            -target SkyHop \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            SYMROOT="$RUNNER_TEMP/BuildProducts" \
            OBJROOT="$RUNNER_TEMP/BuildIntermediates" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/xcodebuild.log" 2>&1
          EXIT_CODE=$?
          cat "$RUNNER_TEMP/xcodebuild.log"
          if [ $EXIT_CODE -ne 0 ]; then
            grep -E "error:|fatal error:" "$RUNNER_TEMP/xcodebuild.log" | head -n 15 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $EXIT_CODE
          fi

      - name: Package SkyHop.ipa
        run: |
          APP_PATH="$RUNNER_TEMP/BuildProducts/Release-iphoneos/SkyHop.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::SkyHop.app was not found at $APP_PATH"
            ls -la "$RUNNER_TEMP/BuildProducts" || true
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/SkyHop.app"

          # Apply ad-hoc signature structure so Sideloadly / AltStore / SideStore re-sign cleanly
          codesign --force --deep --sign - --timestamp=none "$RUNNER_TEMP/ipa/Payload/SkyHop.app"

          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/SkyHop.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/SkyHop.ipa"

      - name: Upload SkyHop.ipa Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkyHop-iOS-IPA
          path: SkyHop.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish SkyHop.ipa to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Sky Hop v1.0.${{ github.run_number }} (iPhone 16 Pro Max IPA)"
          body: |
            ### Sky Hop (`SkyHop.ipa`)
            - **Target:** iPhone 16 Pro Max (iOS 18.0+, 120Hz ProMotion)
            - **Install from Windows 11:** Download **`SkyHop.ipa`** below and install onto your iPhone using **Sideloadly** or **AltStore** with your Apple ID.
          files: SkyHop.ipa
          make_latest: true
